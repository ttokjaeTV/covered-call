name: Update covered call data

on:
  schedule:
    # 평일 한국시간 19:41 (UTC 10:41) — 트래커 시세 수집(19:15) 뒤
    - cron: '41 10 * * 1-5'
  workflow_dispatch:

concurrency:
  group: update-data
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build data
        run: python scripts/build_data.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cc-data.json data/build-report.txt
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "chore(data): update covered call data [skip ci]"
            git push
          fi
